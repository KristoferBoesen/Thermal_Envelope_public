[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aethon"
version = "0.1.0"
description = "AETHON — Analysis of Encapsulated Thermal Heat and Optimised Nuclides"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aethon             = "aethon.__main__:main"
decay-preprocessor = "decay_preprocessor.run_preprocessor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aethon*", "decay_preprocessor*"]
