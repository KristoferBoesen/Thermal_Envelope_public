# =============================================================================
# solver_config.yaml - settings for AETHON
# =============================================================================
# Run with:  aethon
#
# Every key is documented in docs/reference.md#configuration-file
# New here?  docs/tutorial.md walks through a complete run.
# =============================================================================


# --- 1. Your waste stream ----------------------------------------------------
# The decay curve, written by the decay preprocessor. Point this at your own
# output once you have run it. Each run prints which curve it used and its heat
# output at shutdown, so check that line before trusting results.

waste_source: examples/ca_recycling_waste_source.yaml


# --- 2. Your matrix ----------------------------------------------------------
# One entry from the materials library below. Override with --material.
# The default is paired with the waste stream above; change both together.

material: CA_Recycling_Bg-CaF2


# --- 3. Your campaign --------------------------------------------------------
# Affects fleet size only, never temperature.

campaign:
  total_waste_mass_kg: 116.0     # [kg]
  canister_aspect_ratio: 6.0     # height / radius


# --- 4. Your constraints -----------------------------------------------------
# When the waste can be sealed into a canister, in years from reactor shutdown.
# 'min' must not be earlier than the preprocessor's --cutoff-years, or the
# decay curve is read outside its fitted range.

pre_encapsulation_years:
  min: 0.0833                    # 1 month
  max: 5.0

safety_factor: 1.0               # divides every temperature limit


# --- 5. Your site ------------------------------------------------------------
# Worst-case conditions in the interim store and the repository.

passive:
  h: 5.0                         # natural convection [W/(m2.K)]
  ambient_C: 50.0                # [degC]


# --- 6. What to compare ------------------------------------------------------
# Chosen from the libraries at the bottom of this file. Comment out a line to
# compare everything defined. --repo and --archetype override for one run.
#
# Each cooling technology costs a full pass of the transient solver, so cutting
# this list is the quickest way to shorten a run.

geologies:  [Bentonite, Salt]
archetypes: [NaturalAir, ForcedAir, WaterPool]


# --- 7. What to sweep --------------------------------------------------------
# The axes of both output maps. Radii are sampled logarithmically, loadings
# linearly. Too few points and the contours look stepped.
#
# Cost is radii.steps x loadings.steps x archetypes transient solves. The
# passive map is analytic and free at any resolution; only the encapsulation
# map is expensive.

radii:
  min: 0.05                      # [m]
  max: 0.5                       # [m]
  steps: 20

loadings:
  min: 5.0                       # [wt%]
  max: 25.0                      # [wt%]
  steps: 11


# --- 8. Designs to check -----------------------------------------------------
# Optional. Reports exact numbers for designs you have shortlisted, against
# every geology and technology. They need not lie on the sweep grid.
#
# candidates:
#   - {name: A, radius_m: 0.080, loading_pct: 15}
#   - {name: B, radius_m: 0.140, loading_pct: 10}
#   - {name: D, radius_m: 0.215, loading_pct: 25}


# =============================================================================
# Libraries - extend or edit these, then select from them in section 6.
# =============================================================================


# --- Materials ---------------------------------------------------------------
# k and cp are Python expressions in T (KELVIN), with numpy available as np.
# Adding your own: docs/how-to.md#add-my-own-waste-form-material

materials:

  # Reference matrix for LWR and other conventional reactor waste.
  BorosilicateGlass:
    rho_base: 2230.0                                  # [kg/m3]
    k:  "1.2"                                         # [W/(m.K)]
    cp: "935.56 + 0.38953*T - 24617000/T**2"          # [J/(kg.K)]
    centerline_limit_C: 500.0                         # devitrification onset

  # Copenhagen Atomics HIPed glass-ceramics for Thorium MSR waste.
  # Both cp fits turn over above ~1500 K; do not extrapolate them.
  CA_Recycling_Bg-CaF2:
    rho_base: 2321.5                                  # [kg/m3]
    k:  "1.585 - 3.879e-4*T + 1.291e-7*T**2"          # [W/(m.K)]
    cp: "330.6 + 1.911*T - 1.086e-3*T**2"             # [J/(kg.K)]
    centerline_limit_C: 500.0

  CA_Emergency_Bg-CaF2-Zr:
    rho_base: 3052.8                                  # [kg/m3]
    k:  "2.797 - 2.015e-3*T + 1.176e-6*T**2"          # [W/(m.K)]
    cp: "406.1 + 1.348*T - 7.654e-4*T**2"             # [J/(kg.K)]
    centerline_limit_C: 500.0


# --- Repository geologies ----------------------------------------------------
# The limit is set by the buffer material in contact with the canister, not by
# the rock itself.

repositories:
  Bentonite:
    surface_limit_C: 100.0       # [degC]
  Salt:
    surface_limit_C: 200.0       # [degC]


# --- Cooling technologies ----------------------------------------------------
# h and ambient_C travel as a pair: convective flux is h*(T_surface - ambient),
# so a cooler hall substitutes directly for a better coefficient.
#
# >>> LITERATURE-TYPICAL RANGES FOR ORIENTATION, NOT VENDOR DATA. <<<
# Any conclusion of the form "forced air is sufficient" depends entirely on
# these. Edit them to match your own facility before relying on one.

cooling_archetypes:

  NaturalAir:
    h: 5.0                       # [W/(m2.K)]
    ambient_C: 40.0              # [degC]
    description: Unforced air in a passive vault; no cooling plant.

  ForcedAir:
    h: 25.0
    ambient_C: 40.0
    description: Fan-driven air over the canister surface.

  WaterPool:
    h: 750.0
    ambient_C: 40.0
    description: Full immersion in a cooled water pool.


# --- Solver internals --------------------------------------------------------
# Numerical settings, not physics. Leave these alone unless you know why.

nodes: 50                        # radial finite-difference nodes
max_years: 50.0                  # transient simulation horizon [yr]
